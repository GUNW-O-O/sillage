# 로컬 개발용 Postgres. 배포는 Supabase(ap-northeast-2).
# 이미지 태그는 Supabase 가 돌리는 메이저 버전에 고정한다 — 설계 8장.
services:
  db:
    image: postgres:17
    container_name: sillage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sillage
      POSTGRES_PASSWORD: sillage_local
      POSTGRES_DB: sillage
      # locale=C 를 쓰면 안 된다 — LC_CTYPE=C 에서는 한글이 문자로 인식되지 않아
      # pg_trgm 이 트라이그램을 만들지 않는다. 한글 제품명의 근접 검색이 통째로 죽는다.
      #   similarity('테라로사','테라로자') = 0   (locale=C)
      # Supabase 기본값과 같은 en_US.UTF-8 로 맞춘다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - sillage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sillage -d sillage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sillage-pgdata:
